<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bloxflip Emulator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="top">
      <div>
        <h1>Bloxflip Emulator</h1>
        <p>session sticks on refresh</p>
      </div>
      <button id="refresh" type="button" title="Reset session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <polyline points="21 3 21 9 15 9" />
        </svg>
      </button>
    </div>

    <div class="fields">
      <div class="field">
        <label for="bal">Balance</label>
        <input id="bal" type="number" step="0.01" min="0" placeholder="10000" />
      </div>
      <div class="field">
        <label for="wager">Wager</label>
        <input id="wager" type="number" step="0.01" min="0" placeholder="0" />
      </div>
      <div class="field">
        <label for="user">Username</label>
        <input id="user" type="text" placeholder="display name" maxlength="32" spellcheck="false" />
      </div>
    </div>

    <p class="hint">Mines/towers: left click safe, right click bomb. Dice win unless you hold <b>Q</b>.</p>
    <p id="status" class="foot"></p>

    <div class="promo">
      <a href="https://www.youtube.com/@StarPredictor" target="_blank" rel="noreferrer">youtube</a>
      <span>·</span>
      <a href="https://discord.com/invite/AWXSDddSpp" target="_blank" rel="noreferrer">discord</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
